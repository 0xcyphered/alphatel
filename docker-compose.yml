services:
  alphatel:
    build:
      context: .
      dockerfile: Dockerfile
    image: alphatel:latest
    container_name: alphatel
    ports:
      - "8443:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
